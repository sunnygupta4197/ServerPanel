version: '3.8'

services:
  # Main ServerPanel Pro application
  serverpanel:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: serverpanel-pro
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: serverpanel
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      DB_NAME: serverpanel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_session_secret_in_production}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-30000}
    volumes:
      - serverpanel_data:/app/data
      - serverpanel_uploads:/app/uploads
      - serverpanel_logs:/app/logs
      - serverpanel_backups:/app/backups
      - serverpanel_certificates:/app/certificates
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker management
      - /:/host:ro  # Read-only access to host filesystem
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serverpanel_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.serverpanel.rule=Host(`panel.yourdomain.com`)"
      - "traefik.http.routers.serverpanel.tls=true"
      - "traefik.http.routers.serverpanel.tls.certresolver=letsencrypt"

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: serverpanel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: serverpanel
      MYSQL_USER: serverpanel
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - serverpanel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: serverpanel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - serverpanel_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL (alternative database)
  postgres:
    image: postgres:15-alpine
    container_name: serverpanel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: serverpanel
      POSTGRES_USER: serverpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - serverpanel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serverpanel -d serverpanel"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - postgres

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: serverpanel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - serverpanel_certificates:/etc/nginx/ssl:ro
      - serverpanel_logs:/var/log/nginx
    depends_on:
      - serverpanel
    networks:
      - serverpanel_network
    profiles:
      - nginx

  # Traefik reverse proxy (alternative to nginx)
  traefik:
    image: traefik:v3.0
    container_name: serverpanel-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@yourdomain.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/data
      - ./docker/traefik/acme.json:/acme.json
    networks:
      - serverpanel_network
    profiles:
      - traefik

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: serverpanel-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - serverpanel_network
    profiles:
      - monitoring

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: serverpanel-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_password_change_me}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - serverpanel_network
    profiles:
      - monitoring

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: serverpanel-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - serverpanel_network
    profiles:
      - monitoring

  # Mail server (Postfix + Dovecot)
  mail:
    image: tvial/docker-mailserver:latest
    container_name: serverpanel-mail
    restart: unless-stopped
    hostname: mail.yourdomain.com
    domainname: yourdomain.com
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - serverpanel_certificates:/tmp/ssl:ro
      - ./docker/mail/config:/tmp/docker-mailserver
    environment:
      ENABLE_SPAMASSASSIN: 1
      ENABLE_CLAMAV: 1
      ENABLE_FAIL2BAN: 1
      ENABLE_POSTGREY: 1
      ONE_DIR: 1
      DMS_DEBUG: 0
      SSL_TYPE: manual
      SSL_CERT_PATH: /tmp/ssl/cert.pem
      SSL_KEY_PATH: /tmp/ssl/key.pem
    networks:
      - serverpanel_network
    profiles:
      - mail

  # Webmail interface
  webmail:
    image: roundcube/roundcubemail:latest
    container_name: serverpanel-webmail
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: mysql
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_PASSWORD:-roundcube_password_change_me}
      ROUNDCUBEMAIL_DEFAULT_HOST: mail
      ROUNDCUBEMAIL_SMTP_SERVER: mail
    ports:
      - "8080:80"
    depends_on:
      - mysql
      - mail
    networks:
      - serverpanel_network
    profiles:
      - mail

  # Backup service
  backup:
    image: alpine:latest
    container_name: serverpanel-backup
    restart: "no"
    command: |
      sh -c "
        apk add --no-cache mysql-client postgresql-client redis rsync
        while true; do
          echo 'Starting backup at' $(date)
          
          # Database backups
          mysqldump -h mysql -u serverpanel -p${DB_PASSWORD:-secure_password_change_me} serverpanel > /backups/mysql_$(date +%Y%m%d_%H%M%S).sql
          
          # File backups
          rsync -av /app/uploads/ /backups/uploads/
          rsync -av /app/certificates/ /backups/certificates/
          
          # Clean old backups (keep 7 days)
          find /backups -name '*.sql' -mtime +7 -delete
          
          echo 'Backup completed at' $(date)
          sleep 86400  # Run daily
        done
      "
    volumes:
      - serverpanel_uploads:/app/uploads:ro
      - serverpanel_certificates:/app/certificates:ro
      - serverpanel_backups:/backups
    networks:
      - serverpanel_network
    profiles:
      - backup

  # Log aggregation with Fluentd
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: serverpanel-fluentd
    restart: unless-stopped
    volumes:
      - ./docker/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - serverpanel_logs:/var/log/serverpanel:ro
      - /var/log:/var/log/host:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - serverpanel_network
    profiles:
      - logging

  # Elasticsearch for log storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: serverpanel-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - serverpanel_network
    profiles:
      - logging

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: serverpanel-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - serverpanel_network
    profiles:
      - logging

# Named volumes for data persistence
volumes:
  serverpanel_data:
    driver: local
  serverpanel_uploads:
    driver: local
  serverpanel_logs:
    driver: local
  serverpanel_backups:
    driver: local
  serverpanel_certificates:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  traefik_data:
    driver: local
  mail_data:
    driver: local
  mail_state:
    driver: local
  mail_logs:
    driver: local

# Networks
networks:
  serverpanel_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16